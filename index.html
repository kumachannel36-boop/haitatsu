<script>
"use strict";
/* =========================================================
   配達データ分析 Web版
   ここに Supabase の「Project URL」と「anon public key」を入れます。
   空のままだと「お試しモード（この端末だけに保存）」で動きます。
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: "https://bhznwbncnzlnpbieetah.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_yGjF4h6tzLMqOS7pblB8Eg_6suHoUZA",
  ID_DOMAIN: "users.haitatsu-bunseki.app" // IDをログイン用のアドレスに変える時の末尾（変えない）
};

/* ---------------- 小さな道具 ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const HOUR = 3600e3;
const T = (d) => (d ? new Date(d).getTime() : NaN);
const iso = (d) => new Date(d).toISOString();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = (a) => a.reduce((x, y) => x + y, 0);
const avg = (a) => (a.length ? sum(a) / a.length : null);
const median = (a) => {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
};
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const Fmt = {
  hm(d) { if (!d || isNaN(T(d))) return "--:--"; const x = new Date(d); return x.getHours() + ":" + String(x.getMinutes()).padStart(2, "0"); },
  day(d) { const x = new Date(d); return `${x.getMonth() + 1}/${x.getDate()}(${WD[x.getDay()]})`; },
  ymd(d) { const x = new Date(d); return `${x.getFullYear()}/${String(x.getMonth() + 1).padStart(2, "0")}/${String(x.getDate()).padStart(2, "0")}`; },
  csv(d) { if (!d) return ""; const x = new Date(d); return `${Fmt.ymd(x)} ${String(x.getHours()).padStart(2, "0")}:${String(x.getMinutes()).padStart(2, "0")}`; },
  dur(ms) { const m = Math.round(Math.abs(ms) / 60000), h = Math.floor(m / 60); return h > 0 ? `${h}時間${m % 60}分` : `${m}分`; },
  num(v) { return v == null || !isFinite(v) ? "-" : (Math.round(v * 10) / 10).toFixed(1); },
  mins(m) { const v = Math.round(m); return `${Math.floor(v / 60)}:${String(((v % 60) + 60) % 60).padStart(2, "0")}`; },
  inputTime(d) { const x = d ? new Date(d) : new Date(); return `${String(x.getHours()).padStart(2, "0")}:${String(x.getMinutes()).padStart(2, "0")}`; },
  inputDate(d) { const x = d ? new Date(d) : new Date(); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }
};
/** 日付（基準）＋ "HH:MM" から日時を作る */
function atTime(base, hhmm) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(base); d.setHours(h, m, 0, 0); return d;
}
const sameDay = (a, b) => { const x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate(); };
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

/* ---------------- クラウド（Supabase：ライブラリなしで直接通信） ---------------- */
const Cloud = {
  get enabled() { return !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY); },
  key: "hp_auth",
  session: null,
  idToEmail(id) {
    const v = id.trim().toLowerCase();
    return v.includes("@") ? v : `${v}@${CONFIG.ID_DOMAIN}`;
  },
  loadSession() {
    try { this.session = JSON.parse(localStorage.getItem(this.key) || "null"); } catch { this.session = null; }
    return this.session;
  },
  storeSession(s) {
    this.session = s;
    try { s ? localStorage.setItem(this.key, JSON.stringify(s)) : localStorage.removeItem(this.key); } catch {}
  },
  async call(path, opts = {}) {
    const headers = { apikey: CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json", ...(opts.headers || {}) };
    if (opts.auth !== false) {
      const tok = await this.token();
      if (tok) headers.Authorization = "Bearer " + tok;
    }
    const res = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/, "") + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const text = await res.text();
    let json = null; try { json = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) {
      const msg = (json && (json.msg || json.error_description || json.message || json.error)) || res.statusText || "通信エラー";
      const e = new Error(msg); e.status = res.status; e.code = json && (json.error_code || json.code); throw e;
    }
    return json;
  },
  withExpiry(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: j.user }; },
  async token() {
    const s = this.session;
    if (!s) return null;
    if (Date.now() < s.expires_at - 60e3) return s.access_token;
    try {
      const j = await this.call("/auth/v1/token?grant_type=refresh_token", { method: "POST", auth: false, body: { refresh_token: s.refresh_token } });
      this.storeSession(this.withExpiry(j));
      return this.session.access_token;
    } catch (e) {
      if (e.status === 400 || e.status === 401) this.storeSession(null);
      throw e;
    }
  },
  async signUp(id, pw) {
    const j = await this.call("/auth/v1/signup", { method: "POST", auth: false, body: { email: this.idToEmail(id), password: pw, data: { login_id: id } } });
    if (!j || !j.access_token) {
      throw new Error("登録は受け付けましたが、ログインできませんでした。Supabaseの「Confirm email」がオフになっているか確認してください。");
    }
    this.storeSession(this.withExpiry(j));
    return this.session.user;
  },
  async signIn(id, pw) {
    const j = await this.call("/auth/v1/token?grant_type=password", { method: "POST", auth: false, body: { email: this.idToEmail(id), password: pw } });
    this.storeSession(this.withExpiry(j));
    return this.session.user;
  },
  async signOut() {
    try { await this.call("/auth/v1/logout", { method: "POST" }); } catch {}
    this.storeSession(null);
  },
  async changePassword(pw) { await this.call("/auth/v1/user", { method: "PUT", body: { password: pw } }); },
  async load() {
    const rows = await this.call(`/rest/v1/app_data?select=data,updated_at&user_id=eq.${this.session.user.id}`);
    return rows && rows[0] ? rows[0] : null;
  },
  async save(data) {
    const now = new Date().toISOString();
    await this.call("/rest/v1/app_data?on_conflict=user_id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: { user_id: this.session.user.id, data, updated_at: now }
    });
    return now;
  },
  async deleteAccount() {
    await this.call("/rest/v1/app_data?user_id=eq." + this.session.user.id, { method: "DELETE" });
    await this.call("/rest/v1/rpc/delete_my_account", { method: "POST", body: {} });
    this.storeSession(null);
  }
};

function authErrorText(e) {
  const m = String(e && e.message || e);
  if (/Invalid login credentials/i.test(m)) return "IDかパスワードが違います。";
  if (/already registered|already exists|User already/i.test(m)) return "このIDはすでに使われています。別のIDにするか、ログインしてください。";
  if (/Password should be|weak/i.test(m)) return "パスワードが短すぎるか、簡単すぎます。8文字以上で、英字と数字を混ぜてください。";
  if (/Email.*invalid|invalid.*email/i.test(m)) return "IDに使えない文字があります。半角の英字・数字・「-」「_」「.」だけにしてください。";
  if (/rate|too many/i.test(m)) return "短い時間に何度も試したため、少し待ってからもう一度お試しください。";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "インターネットに接続できません。電波の良い所でもう一度お試しください。";
  return "エラー：" + m;
}

/* =========================================================
   計算（アプリと同じ考え方）
   ========================================================= */
const A = {
  sorted(s) { return [...(s.snapshots || [])].sort((a, b) => T(a.time) - T(b.time)); },
  /** 終了していれば「残り0」の点を最後に足す */
  eff(s) {
    const a = A.sorted(s);
    if (s.finishedAt && a.length) {
      const l = a[a.length - 1];
      if (l.packages > 0 && T(s.finishedAt) > T(l.time)) a.push({ time: s.finishedAt, destinations: 0, locations: 0, packages: 0, breakMinutes: 0 });
    }
    return a;
  },
  val(sn, m) { return m === "dest" ? sn.destinations : m === "loc" ? sn.locations : sn.packages; },
  /** 区間 [a,b] に重なるロスタイム（休憩以外・分） */
  lossIn(s, a, b) {
    let m = 0;
    for (const l of s.losses || []) {
      if (l.reason === "休憩" || !l.start) continue;
      const st = Math.max(T(l.start), T(a)), en = Math.min(T(l.end || Date.now()), T(b));
      if (en > st) m += (en - st) / 60000;
    }
    return m;
  },
  lossMinutes(s, includeRest = false) {
    return sum((s.losses || []).filter((l) => includeRest || l.reason !== "休憩").map((l) => Math.max(0, (T(l.end || Date.now()) - T(l.start)) / 60000)));
  },
  workHours(s, a, b) {
    const h = (T(b.time) - T(a.time)) / HOUR - (b.breakMinutes || 0) / 60 - A.lossIn(s, a.time, b.time) / 60;
    return Math.max(0, h);
  },
  covered(s, snaps) { let h = 0; for (let i = 1; i < snaps.length; i++) h += A.workHours(s, snaps[i - 1], snaps[i]); return h; },
  intervals(s, snaps = A.eff(s)) {
    const r = [];
    for (let i = 1; i < snaps.length; i++) {
      const a = snaps[i - 1], b = snaps[i], hours = A.workHours(s, a, b);
      r.push({
        i, from: a.time, to: b.time, hours, breakMinutes: b.breakMinutes || 0,
        dPkg: a.packages - b.packages, dDest: a.destinations - b.destinations, dLoc: a.locations - b.locations,
        myEstimate: b.myEstimate, appEstimate: b.appEstimate,
        per(m = "pkg") { const d = m === "dest" ? this.dDest : m === "loc" ? this.dLoc : this.dPkg; return this.hours > 0.01 ? d / this.hours : 0; }
      });
    }
    return r;
  },
  /** 作業ペース：積み込み直後の遅い区間を外し、極端な区間をならす */
  workPace(s, snaps, m = "pkg") {
    let ivs = A.intervals(s, snaps).filter((iv) => iv.hours >= 0.08);
    if (!ivs.length) return null;
    if (ivs.length >= 3) {
      const rest = median(ivs.slice(1).map((iv) => iv.per(m)));
      if (rest > 0 && ivs[0].per(m) < rest * 0.6) ivs = ivs.slice(1);
    }
    const med = median(ivs.map((iv) => iv.per(m)));
    if (!(med > 0)) {
      const h = sum(ivs.map((iv) => iv.hours)), d = sum(ivs.map((iv) => (m === "dest" ? iv.dDest : m === "loc" ? iv.dLoc : iv.dPkg)));
      return h >= 0.08 && d > 0 ? d / h : null;
    }
    let w = 0, t = 0;
    for (const iv of ivs) { const p = clamp(iv.per(m), med * 0.4, med * 1.8); w += p * iv.hours; t += iv.hours; }
    return t >= 0.08 ? w / t : null;
  },
  sessionPace(s, m = "pkg") {
    const snaps = A.eff(s);
    if (A.covered(s, snaps) < 0.5) return null;
    const p = A.workPace(s, snaps, m);
    return p > 0 ? p : null;
  },
  initial(s, m = "pkg") {
    const f = A.sorted(s)[0];
    if (!f) return 0;
    return m === "dest" ? f.destinations + (f.completed || 0) : A.val(f, m);
  },
  delivered(s) { const l = A.sorted(s).at(-1); if (!l) return 0; return s.finishedAt ? A.initial(s) : Math.max(0, A.initial(s) - l.packages); },
  durationMin(s) { return s.finishedAt ? (T(s.finishedAt) - T(s.startTime)) / 60000 : null; },
  nextStop(s) {
    const l = A.sorted(s).at(-1);
    if (!l) return 1;
    const done = l.completed ?? Math.max(0, A.initial(s, "dest") - l.destinations);
    return done + 1;
  },
  past(sessions, before, trip) {
    const all = sessions.filter((x) => x.finishedAt && T(x.startTime) < T(before));
    const same = all.filter((x) => x.trip === trip);
    return same.length >= 3 ? same : all;
  },
  stats(list) {
    const recent = [...list].sort((a, b) => T(b.startTime) - T(a.startTime)).slice(0, 10);
    const p = [], d = [], hrs = [];
    for (const s of recent) {
      const v = A.sessionPace(s, "pkg"); if (v) p.push(v);
      const dv = A.sessionPace(s, "dest"); if (dv) d.push(dv);
      const du = A.durationMin(s); if (du) hrs.push(du / 60);
    }
    if (!p.length) return null;
    return { pkg: median(p), dest: median(d) || 0, count: p.length, avgHours: avg(hrs) };
  },
  /** 過去の予測のずれ（実際の残り時間 ÷ 予測した残り時間） */
  correction(list) {
    const ratios = [];
    for (const s of [...list].sort((a, b) => T(b.startTime) - T(a.startTime)).slice(0, 10)) {
      for (const sn of s.snapshots || []) {
        if (!sn.appEstimate || sn.packages <= 0) continue;
        const pred = T(sn.appEstimate) - T(sn.time), act = T(s.finishedAt) - T(sn.time);
        if (pred > 15 * 60000 && act > 0) ratios.push(act / pred);
      }
    }
    if (ratios.length < 3) return null;
    return { factor: clamp(median(ratios), 0.8, 1.3), n: ratios.length };
  },
  similar(list, s) {
    const n = A.initial(s);
    if (!n) return null;
    const sim = list.filter((x) => { const k = A.initial(x); return k > 0 && Math.abs(k - n) / n <= 0.15 && A.durationMin(x); });
    if (sim.length < 2) return null;
    return { minutes: median(sim.map(A.durationMin)), count: sim.length };
  },
  /** 終了予定の予測 */
  forecast(s, sessions, settings) {
    const f = { hasData: false, isDone: false, eta: null, method: "まだデータがありません", notes: [] };
    const snaps = A.sorted(s);
    const last = snaps.at(-1);
    if (!last) return f;
    const pin = settings.countReturnPin ? 0 : 1;
    f.hasData = true; f.lastTime = last.time;
    f.remainingPkg = last.packages;
    f.remainingDest = Math.max(0, last.destinations - (last.destinations > 0 ? pin : 0));
    f.nextStop = A.nextStop(s);
    if (s.finishedAt || (last.packages <= 0 && f.remainingDest <= 0)) {
      f.isDone = true; f.eta = s.finishedAt || last.time; f.method = "完了"; f.pkgPace = A.sessionPace(s) || 0; return f;
    }
    const past = A.past(sessions, s.startTime, s.trip);
    const hist = A.stats(past);
    const hours = A.covered(s, snaps);
    f.currentHours = hours;
    const prior = hist ? hist.pkg : settings.defaultPkgPace;
    let cur = snaps.length >= 2 ? A.workPace(s, snaps) : null;
    if (cur && snaps.length >= 3) {
      const ivs = A.intervals(s, snaps).filter((iv) => iv.hours >= 0.08);
      const lastIv = ivs.at(-1);
      if (lastIv && lastIv.per() > 0) {
        const w = clamp(settings.recentWeight, 0, 1);
        cur = clamp(lastIv.per(), cur * 0.5, cur * 1.6) * w + cur * (1 - w);
      }
    }
    f.currentPace = cur; f.historyPace = hist ? hist.pkg : null;
    let pace = prior, curPct = 0;
    if (cur && hours > 0) {
      const k = Math.max(0.1, settings.priorHours);
      pace = (cur * hours + prior * k) / (hours + k);
      curPct = Math.round((hours / (hours + k)) * 100);
    }
    f.pkgPace = pace;
    const priorName = hist ? `過去${hist.count}回の実績` : "標準ペース";
    f.method = !cur || curPct === 0 ? `${priorName}（今回の記録がまだ1回のため）` : curPct >= 95 ? "今回の実績ペース" : `今回${curPct}%＋${priorName}${100 - curPct}%`;
    if (pace > 0) {
      let remainMs = (last.packages / pace) * HOUR;
      f.etaRaw = new Date(T(last.time) + remainMs);
      const corr = A.correction(past);
      if (corr && Math.abs(corr.factor - 1) >= 0.03) {
        remainMs *= corr.factor;
        f.correctionMin = Math.round(((corr.factor - 1) * last.packages / pace) * 60);
        f.notes.push(`過去の予測のずれ（${corr.n}回分）から${f.correctionMin >= 0 ? "+" : ""}${f.correctionMin}分補正`);
      }
      f.eta = new Date(T(last.time) + remainMs);
    }
    const sim = A.similar(past, s);
    if (sim) { f.etaSimilar = new Date(T(s.startTime) + sim.minutes * 60000); f.similarCount = sim.count; }
    const dp = A.workPace(s, snaps, "dest");
    f.destPace = dp || (hist && hist.dest) || pace * (last.packages ? last.destinations / last.packages : 0.6);
    if (s.targetEnd) {
      const hrs = (T(s.targetEnd) - T(last.time)) / HOUR;
      f.requiredPace = hrs > 0 ? last.packages / hrs : Infinity;
      const ideal = A.idealDelivered(s, Date.now());
      f.aheadPkgs = ideal == null ? null : Math.round(A.delivered(s) - ideal);
    }
    return f;
  },
  arrival(f, n) {
    if (!f || f.isDone || !f.lastTime || !(f.destPace > 0) || n < f.nextStop) return null;
    return new Date(T(f.lastTime) + ((n - f.nextStop + 0.5) / f.destPace) * HOUR);
  },
  idealDelivered(s, at) {
    if (!s.targetEnd) return null;
    const total = A.initial(s), st = T(s.startTime), en = T(s.targetEnd);
    if (en <= st) return null;
    return total * clamp((T(at) - st) / (en - st), 0, 1);
  },
  margin(s, f) {
    if (!s.targetEnd || !f.eta || f.isDone) return null;
    const diff = (T(f.eta) - T(s.targetEnd)) / 60000;
    if (diff <= -10) return { key: "relaxed", label: "余裕", emoji: "🟢", diff };
    if (diff <= 10) return { key: "caution", label: "注意", emoji: "🟡", diff };
    return { key: "tight", label: "厳しい", emoji: "🔴", diff };
  },
  /** 過去の便の平均的な減り方（開始からの経過時間ごとの残り割合） */
  averageCurve(list) {
    const pts = [];
    for (const s of list.slice(-10)) {
      const total = A.initial(s); if (!total) continue;
      for (const sn of A.eff(s)) pts.push({ h: (T(sn.time) - T(s.startTime)) / HOUR, r: sn.packages / total });
    }
    if (pts.length < 4) return null;
    const out = [];
    for (let h = 0; h <= 10; h += 0.5) {
      const near = pts.filter((p) => Math.abs(p.h - h) <= 0.5).map((p) => p.r);
      if (near.length >= 2) out.push({ h, r: median(near) });
    }
    return out.length >= 3 ? out : null;
  }
};

/* ---------------- 会社・店舗の営業状況 ---------------- */
function placeHours(p) {
  const parts = [];
  if (p.open && p.close) parts.push(`${p.open}〜${p.close}`);
  if ((p.closedDays || []).length) parts.push("定休 " + p.closedDays.map((d) => WD[d]).join("・"));
  if (p.breakText) parts.push(p.breakText);
  return parts.length ? parts.join(" / ") : "営業時間 未設定";
}
function placeStatus(p, date = new Date()) {
  const d = new Date(date);
  if ((p.closedDays || []).includes(d.getDay())) return { closed: true, text: "定休日" };
  if (!p.open || !p.close) return { closed: false, text: "", unknown: true };
  const toM = (x) => { const [h, m] = x.split(":").map(Number); return h * 60 + m; };
  const m = d.getHours() * 60 + d.getMinutes(), o = toM(p.open), c = toM(p.close);
  if (m < o) return { closed: true, text: `開店前（${p.open}から）` };
  if (m >= c) return { closed: true, text: `営業終了（${p.close}まで）` };
  if (c - m <= 30) return { closed: false, soon: true, text: `まもなく終了（${p.close}まで）` };
  return { closed: false, text: `営業中（${p.close}まで）` };
}

      const cm = line.match(/C[0-9]{1,2}-[0-9]{1,2}[A-Z]/);

        const bag = { id: uid(), code: cm[0], color: "", number: "", from: 0, to: 0, overflow: inOverflow, size: "", done: false };
        const a = area || (inOverflow ? pending : null);
        if (a) { bag.from = a[0]; bag.to = a[1]; }
        fill(bag, area ? "" : line.replace(cm[0], ""));
        bags.push(bag); cur = bags.length - 1; continue;
      }
      if (area) { pending = area; cur = null; continue; }
      if (cur != null && !bags[cur].number) fill(bags[cur], line);
    }
    return bags;
  },
  bagKey(b) { return `${b.code}|${b.from ? b.from + "-" + b.to : b.number}|${b.overflow ? "o" : "b"}`; },
  _worker: null,
  async read(file, onProgress) {
    if (!window.Tesseract) {
      onProgress && onProgress("文字認識の準備中（初回だけ少し時間がかかります）…");
      await new Promise((ok, ng) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"; sc.onload = ok; sc.onerror = () => ng(new Error("文字認識の部品を読み込めませんでした")); document.head.appendChild(sc); });
    }
    if (!OCR._worker) OCR._worker = await Tesseract.createWorker(["jpn", "eng"], 1, { logger: (m) => { if (m.status === "recognizing text" && onProgress) onProgress(`読み取り中… ${Math.round(m.progress * 100)}%`); } });
    const { data } = await OCR._worker.recognize(file);
    return (data.lines || []).map((l) => l.text.trim()).filter(Boolean);
  }
};

/* =========================================================
   グラフ（SVG・外部ライブラリなし）
   ========================================================= */
const Chart = {
  niceTicks(min, max, n = 4) {
    if (!(max > min)) { max = min + 1; }
    const span = max - min, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
    const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => span / s <= n) || 10 * mag;
    const a = Math.floor(min / step) * step, b = Math.ceil(max / step) * step, out = [];
    for (let v = a; v <= b + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
    return out;
  },
  frame(o) {
    const W = o.w || 420, Hh = o.h || 220, L = 40, Rr = 12, Tt = 14, B = 28;
    const xs = (x) => L + ((x - o.xMin) / (o.xMax - o.xMin || 1)) * (W - L - Rr);
    const ys = (y) => Tt + (1 - (y - o.yMin) / (o.yMax - o.yMin || 1)) * (Hh - Tt - B);
    let g = "";
    for (const t of o.yTicks) g += `<line x1="${L}" x2="${W - Rr}" y1="${ys(t)}" y2="${ys(t)}" class="grid"/><text x="${L - 6}" y="${ys(t) + 4}" text-anchor="end" class="tick">${t}</text>`;
    for (const t of o.xTicks || []) g += `<text x="${xs(t.v)}" y="${Hh - 8}" text-anchor="middle" class="tick">${esc(t.label)}</text>`;
    return { W, Hh, L, Rr, Tt, B, xs, ys, g };
  },
  wrap(F, inner, legend) {
    const lg = legend && legend.length ? `<div class="legend">${legend.map((l) => `<span><i style="background:${l.color}${l.dash ? ";height:2px" : ""}"></i>${esc(l.name)}</span>`).join("")}</div>` : "";
    return `<svg class="chart" viewBox="0 0 ${F.W} ${F.Hh}" role="img">${F.g}${inner}</svg>${lg}`;
  },
  /** series: [{name,color,points:[{x,y}],dash,dots}] */
  line(o) {
    const pts = o.series.flatMap((s) => s.points);
    if (!pts.length) return `<p class="muted">データがまだありません</p>`;
    const yMin = o.yMin ?? Math.min(0, ...pts.map((p) => p.y)), yMax0 = o.yMax ?? Math.max(...pts.map((p) => p.y), ...(o.rules || []).map((r) => r.y));
    const yTicks = Chart.niceTicks(yMin, yMax0 * 1.05);
    const xMin = o.xMin ?? Math.min(...pts.map((p) => p.x)), xMax = o.xMax ?? Math.max(...pts.map((p) => p.x));
    const F = Chart.frame({ ...o, xMin, xMax: xMax > xMin ? xMax : xMin + 1, yMin: yTicks[0], yMax: yTicks.at(-1), yTicks });
    let inner = "";
    for (const r of o.rules || []) inner += `<line x1="${F.L}" x2="${F.W - F.Rr}" y1="${F.ys(r.y)}" y2="${F.ys(r.y)}" stroke="${r.color || "#999"}" stroke-dasharray="5 4"/><text x="${F.L + 4}" y="${F.ys(r.y) - 4}" class="tick">${esc(r.label || "")}</text>`;
    for (const s of o.series) {
      if (!s.points.length) continue;
      const d = s.points.map((p, i) => `${i ? "L" : "M"}${F.xs(p.x).toFixed(1)},${F.ys(p.y).toFixed(1)}`).join("");
      inner += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash ? 'stroke-dasharray="6 5"' : ""} stroke-linejoin="round"/>`;
      if (s.dots !== false) for (const p of s.points) inner += `<circle cx="${F.xs(p.x)}" cy="${F.ys(p.y)}" r="3.5" fill="${s.color}"><title>${esc(p.tip || "")}</title></circle>`;
    }
    return Chart.wrap(F, inner, o.series.length > 1 || o.legend ? o.series.map((s) => ({ name: s.name, color: s.color, dash: s.dash })) : null);
  },
  /** items: [{label,value,color,tip}] */
  bar(o) {
    if (!o.items.length) return `<p class="muted">データがまだありません</p>`;
    const vals = o.items.map((i) => i.value);
    const yTicks = Chart.niceTicks(0, Math.max(...vals, o.rule || 0) * 1.12);
    const n = o.items.length;
    const F = Chart.frame({ ...o, xMin: -0.5, xMax: n - 0.5, yMin: 0, yMax: yTicks.at(-1), yTicks, xTicks: o.items.map((it, i) => ({ v: i, label: it.label })) });
    const bw = Math.min(30, ((F.W - F.L - F.Rr) / n) * 0.62);
    let inner = "";
    o.items.forEach((it, i) => {
      const x = F.xs(i) - bw / 2, y = F.ys(Math.max(0, it.value)), h = F.ys(0) - y;
      inner += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0, h)}" rx="5" fill="${it.color || "var(--accent)"}"><title>${esc(it.tip || it.label + " " + Fmt.num(it.value))}</title></rect>`;
      if (o.values) inner += `<text x="${F.xs(i)}" y="${y - 4}" text-anchor="middle" class="tick">${Fmt.num(it.value)}</text>`;
    });
    if (o.rule) inner += `<line x1="${F.L}" x2="${F.W - F.Rr}" y1="${F.ys(o.rule)}" y2="${F.ys(o.rule)}" stroke="#888" stroke-dasharray="5 4"/>`;
    return Chart.wrap(F, inner, o.legend);
  },
  scatter(o) {
    const pts = o.series.flatMap((s) => s.points);
    if (pts.length < 2) return `<p class="muted">データがまだありません</p>`;
    const xT = Chart.niceTicks(Math.min(...pts.map((p) => p.x)) * 0.95, Math.max(...pts.map((p) => p.x)) * 1.05);
    const yT = Chart.niceTicks(0, Math.max(...pts.map((p) => p.y)) * 1.1);
    const F = Chart.frame({ ...o, xMin: xT[0], xMax: xT.at(-1), yMin: 0, yMax: yT.at(-1), yTicks: yT, xTicks: xT.map((v) => ({ v, label: v })) });
    let inner = "";
    for (const s of o.series) for (const p of s.points) inner += `<circle cx="${F.xs(p.x)}" cy="${F.ys(p.y)}" r="6" fill="${s.color}" fill-opacity=".8"><title>${esc(p.tip || "")}</title></circle>`;
    return Chart.wrap(F, inner, o.series.map((s) => ({ name: s.name, color: s.color })));
  }
};

/* =========================================================
   状態・保存・画面の切り替え
   ========================================================= */
const S = {
  mode: "loading", data: null, user: null, local: false,
  route: { tab: "today", page: null, id: null },
  trip: "C1", seg: { charts: "history", memo: "bags", period: "30", tripFilter: "all" },
  modal: null, save: "saved", dirty: false, toast: null, search: "", chat: []
};
const LOCAL_KEY = "hp_local_data";
const cacheKey = () => "hp_cache_" + (S.user ? S.user.id : "x");

/* ---------- 保存 ---------- */
let saveTimer = null, retryTimer = null;
function markDirty() {
  S.dirty = true;
  writeCache();
  if (S.local) { S.save = "saved"; S.dirty = false; return; }
  S.save = "saving";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
function writeCache() {
  try {
    if (S.local) localStorage.setItem(LOCAL_KEY, JSON.stringify(S.data));
    else localStorage.setItem(cacheKey(), JSON.stringify({ data: S.data, dirty: S.dirty, savedAt: Date.now() }));
  } catch (e) { /* 端末の保存がいっぱいでも、クラウドには保存する */ }
}
async function flush() {
  if (S.local || !S.dirty) return;
  clearTimeout(retryTimer);
  try {
    S.dirty = false;
    S.lastSync = await Cloud.save(S.data);
    S.save = "saved";
    writeCache();
  } catch (e) {
    S.dirty = true;
    if (e.status === 401 || !Cloud.session) { S.save = "error"; toast("ログインが切れました。もう一度ログインしてください。"); S.mode = "auth"; render(); return; }
    S.save = "offline";
    retryTimer = setTimeout(flush, 15000);
  }
  updateSavePill();
}
function updateSavePill() {
  const el = $("#savepill");
  if (!el) return;
  const map = { saved: ["✓ 保存済み", "ok"], saving: ["保存中…", "busy"], offline: ["未送信（電波待ち）", "warn"], error: ["保存できません", "warn"] };
  const [t, c] = S.local ? ["この端末に保存", "ok"] : map[S.save] || map.saved;
  el.textContent = t; el.className = "pill " + c;
}
function mutate(fn) { fn(S.data); markDirty(); render(); }
window.addEventListener("online", () => { if (S.dirty) flush(); });
window.addEventListener("beforeunload", (e) => { if (S.dirty && !S.local) { flush(); e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "hidden") { if (S.dirty) flush(); return; }
  if (S.mode === "app" && !S.local && !S.dirty && !S.modal) {
    try { const row = await Cloud.load(); if (row && row.updated_at !== S.lastSync) { S.data = migrate(row.data); S.lastSync = row.updated_at; writeCache(); render(); } } catch {}
  }
});

/* ---------- 起動 ---------- */
async function boot() {
  if (!Cloud.enabled) { S.mode = "auth"; render(); return; }
  if (!Cloud.loadSession()) { S.mode = "auth"; render(); return; }
  S.user = Cloud.session.user;
  await openData();
}
async function openData() {
  S.local = !Cloud.enabled;
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(cacheKey()) || "null"); } catch {}
  if (cache && cache.data) { S.data = migrate(cache.data); S.mode = "app"; render(); }
  try {
    const row = await Cloud.load();
    if (cache && cache.dirty && cache.data && (!row || cache.savedAt > T(row.updated_at))) {
      S.data = migrate(cache.data); S.dirty = true; flush();
    } else if (row) {
      S.data = migrate(row.data); S.lastSync = row.updated_at; S.dirty = false; writeCache();
    } else {
      S.data = migrate(cache && cache.data); S.dirty = true; flush();
    }
    S.mode = "app"; S.save = S.dirty ? "saving" : "saved";
  } catch (e) {
    if (e.status === 401 || !Cloud.session) { S.mode = "auth"; S.authError = "ログインの期限が切れました。もう一度ログインしてください。"; render(); return; }
    if (!S.data) { S.mode = "auth"; S.authError = authErrorText(e); render(); return; }
    S.save = "offline";
  }
  afterOpen();
}
function startLocal() {
  S.local = true; S.user = null;
  try { S.data = migrate(JSON.parse(localStorage.getItem(LOCAL_KEY) || "null")); } catch { S.data = newData(); }
  writeCache(); S.mode = "app"; afterOpen();
}
function afterOpen() {
  S.trip = (S.data.sessions.slice().sort((a, b) => T(b.startTime) - T(a.startTime))[0] || {}).trip || "C1";
  if (!S.data.settings.onboarded) S.modal = { type: "onboarding", step: 0 };
  render(); startReminderLoop();
}

/* ---------- 便の取り出し ---------- */
function sessionsOf(trip) { return S.data.sessions.filter((s) => s.trip === trip).sort((a, b) => T(b.startTime) - T(a.startTime)); }
function latestSession(trip) { return sessionsOf(trip)[0] || null; }
function activeSession(trip = S.trip) {
  const s = latestSession(trip);
  if (!s) return null;
  if (!s.finishedAt || sameDay(s.startTime, new Date())) return s;
  return null;
}
function findSession(id) { return S.data.sessions.find((s) => s.id === id); }
function forecastOf(s) { return A.forecast(s, S.data.sessions, S.data.settings); }

const TABS = [["today", "🚚", "今日"], ["charts", "📊", "グラフ"], ["memo", "🎒", "バッグ・メモ"], ["trouble", "🛟", "困った時"], ["history", "🗓️", "履歴"]];

function toast(t) { S.toast = t; renderToast(); clearTimeout(toast._t); toast._t = setTimeout(() => { S.toast = null; renderToast(); }, 2600); }

async function submitAuth(fd) {
  const id = String(fd.get("id") || "").trim(), pw = String(fd.get("pw") || ""), pw2 = fd.get("pw2");

/* ---------- リマインダー（画面を開いている間だけ） ---------- */

    const st = S.data && S.data.settings;
    if (!st || !st.reminderOn) return;
    const s = activeSession(); if (!s || s.finishedAt) return;
    const last = A.sorted(s).at(-1); if (!last) return;
    const mins = (Date.now() - T(last.time)) / 60000;
    if (mins >= st.reminderMinutes && (!S._lastRemind || Date.now() - S._lastRemind > st.reminderMinutes * 60000)) {
      S._lastRemind = Date.now();
      const msg = `前回の記録から${Math.round(mins)}分たちました。進捗を記録しましょう。`;
      toast(msg);
      try { if ("Notification" in window && Notification.permission === "granted") new Notification("配達データ分析", { body: msg }); } catch {}
    }
  }, 60000);
}

/* ================= グラフ・分析 ================= */
function viewCharts() {
  let h = `<div class="seg">${[["history", "過去の分析"], ["latest", "最新の便"]].map(([k, t]) => `<button data-act="seg" data-k="charts" data-v="${k}" class="${S.seg.charts === k ? "on" : ""}">${t}</button>`).join("")}</div>`;

}
function sessionAnalysis(s) {

    const ap = est.filter((x) => x.appEstimate).map((x) => ({ x: toH(x.time), y: toH(x.appEstimate) }));
    if (ap.length) series.push({ name: "アプリの予測", color: "#2c6fe0", points: ap });
    if (my.length) series.push({ name: "自分の予想", color: "#f08c00", points: my });

}

    h += card(`溢れた荷物（${over.length}）`, "📦", over.length ? over.map((b) => bagRow(b, s.id)).join("") : `<p class="muted">まだありません</p>`);
    return h;
  }
  const f = forecastOf(s);
  const notes = (s.notes || []).slice().sort((a, b) => a.stop - b.stop);
  h += `<button class="btn primary" data-act="modal" data-type="note" data-sid="${s.id}">＋ メモを追加（午前指定・ラッシュ便・エラーピンなど）</button>`;
  h += card(`目的地メモ（${notes.length}）`, "📌", notes.length ? notes.map((n) => noteRow(n, s, f)).join("") : `<p class="muted">まだありません</p>`);
  return h;
}
function bagRow(b, sid) {
  const c = COLOR_HEX[b.color];
  return `<div class="li bag ${b.done ? "done" : ""}">
    <button class="check" data-act="bag-done" data-sid="${sid}" data-id="${b.id}" aria-label="済">${b.done ? "✓" : ""}</button>
    ${c ? `<i class="dot" style="background:${c}"></i>` : b.overflow ? `<i class="dot ov">溢</i>` : ""}
    <b>${esc(b.code)}</b><span>${b.from ? `#${b.from}〜${b.to}` : ""}</span><span class="muted">${esc(b.overflow ? b.size : b.color)} ${esc(b.number)}</span>
    <button class="link" data-act="modal" data-type="bag" data-sid="${sid}" data-id="${b.id}">編集</button></div>`;
}
function noteRow(n, s, f) {
  const p = n.placeId && S.data.places.find((x) => x.id === n.placeId);
  const eta = f && A.arrival(f, n.stop);
  const st = p ? placeStatus(p, eta || new Date()) : null;
  return `<div class="li noterow ${n.done ? "done" : ""}">
    <button class="check" data-act="note-done" data-sid="${s.id}" data-id="${n.id}">${n.done ? "✓" : ""}</button>
    <b>#${n.stop}</b><span class="tag t-${STOP_TAGS.indexOf(n.tag)}">${esc(n.tag)}</span>
    <span class="grow">${esc(n.text)}${p ? ` <span class="muted">${esc(p.name)}${st && st.text ? "・" + esc(st.text) : ""}</span>` : ""}</span>
    <span class="muted small">${n.deadline ? Fmt.hm(n.deadline) + "まで" : ""}${eta ? ` 着${Fmt.hm(eta)}` : ""}</span>
    <button class="link" data-act="modal" data-type="note" data-sid="${s.id}" data-id="${n.id}">編集</button></div>`;
}
function viewPlaces() {
  const list = S.data.places.slice().sort((a, b) => a.name.localeCompare(b.name, "ja"));
  return `<button class="btn primary" data-act="modal" data-type="place">＋ 会社・店舗を追加</button>` + card(`会社・店舗（${list.length}）`, "🏢", list.length ? list.map((p) => { const st = placeStatus(p); return `<div class="li"><span class="tag">${esc(p.kind)}</span><span class="grow"><b>${esc(p.name)}</b><br><span class="muted small">${esc(placeHours(p))}${p.note ? "／" + esc(p.note) : ""}</span></span><span class="small ${st.closed ? "r" : "g"}">${esc(st.text)}</span><button class="link" data-act="modal" data-type="place" data-id="${p.id}">編集</button></div>`; }).join("") : `<p class="muted">営業時間や休みの日をメモしておくと、配達中に「閉まっているかも」を知らせます。</p>`);
}

/* ================= 困った時 ================= */
function viewTroubleRoute(r) {
  if (r.page === "topic") return viewTopic(r.id);
  if (r.page === "glossary") { S.pageTitle = "配達用語辞典"; return viewGlossary(); }
  if (r.page === "areanotes") { S.pageTitle = "注意ポイント"; return viewAreaNotes(); }
  if (r.page === "troubles") { S.pageTitle = "トラブル履歴"; return viewTroubleHistory(); }
  if (r.page === "misses") { S.pageTitle = "ミス記録"; return viewMisses(); }
  if (r.page === "assistant") return viewAssistant();
  const q = S.search.trim();
  const topics = S.data.manuals.filter((m) => !q || [m.title, m.summary, ...m.steps, ...m.points, ...m.cautions].join(" ").includes(q));
  return `<button class="trouble-big" data-act="trouble-sheet">🛟 困った時はここ（状況から探す）</button>
    <input class="search" type="search" placeholder="キーワードで探す（例：オートロック、余った）" value="${esc(S.search)}" data-act="search">
    <div class="links">
      <button data-act="go" data-tab="trouble" data-page="assistant">💬 アシスタント</button>
      <button data-act="go" data-tab="trouble" data-page="glossary">📖 用語辞典</button>
      <button data-act="go" data-tab="trouble" data-page="areanotes">📍 注意ポイント</button>
      <button data-act="go" data-tab="trouble" data-page="troubles">🧯 トラブル履歴</button>
      <button data-act="go" data-tab="trouble" data-page="misses">✍️ ミス記録</button>

    ${card(`対応マニュアル（${topics.length}）`, "📘", topics.map((m) => `<button class="row-btn" data-act="go" data-tab="trouble" data-page="topic" data-id="${m.id}"><span class="tile sm" style="background:var(--accent)">${esc(m.icon)}</span><span class="grow"><b>${esc(m.title)}</b><br><span class="muted small">${esc(m.summary)}</span></span><span class="chev">›</span></button>`).join("") || `<p class="muted">見つかりません</p>`)}
    <div class="row2"><button class="btn" data-act="modal" data-type="topic">＋ 項目を追加</button><button class="btn ghost" data-act="manual-restore">初期の項目を戻す</button></div>`;
}
function artTile(a, size = 56) { return `<span class="tile" style="background:linear-gradient(180deg,${a.color}cc,${a.color});width:${size}px;height:${size}px;font-size:${Math.round(size * 0.5)}px">${a.emoji}</span>`; }
function viewTopic(id) {
  const m = S.data.manuals.find((x) => x.id === id);
  if (!m) return `<p>見つかりません</p>`;
  S.pageTitle = "対応マニュアル";
  let h = `<div class="topic-head">${artTile({ emoji: m.icon, color: "#127686" }, 64)}<h2>${esc(m.title)}</h2></div>`;
  if (m.summary) h += `<p>${esc(m.summary)}</p>`;
  if (m.steps.length) h += card("手順（図解）", "🧭", `<div class="flow">${m.steps.map((st, i) => { const a = stepArt(st); return `${i ? `<span class="arrow">→</span>` : ""}<div class="flow-i">${artTile(a, 56)}<b>${i + 1}. ${esc(a.caption)}</b></div>`; }).join("")}</div><hr>${m.steps.map((st, i) => `<div class="step"><span class="snum">${i + 1}</span>${artTile(stepArt(st), 44)}<p>${esc(st)}</p></div>`).join("")}`);
  if (m.table.length) h += card("ステータス早見表", "📋", `<div class="table st">${m.table.map((r) => `<div class="tr"><span>${esc(r.place)}</span><span>${esc(r.situation)}</span><span><b class="code" style="background:${CODE_COLOR[r.code] || "#555"}">${esc(r.code)}</b></span></div>`).join("")}</div>`);
  if (m.cautions.length) h += card("注意", "⚠️", `<ul>${m.cautions.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>`);
  if (m.points.length) h += card("ポイント", "✅", `<ul>${m.points.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>`);
  if (m.template) h += card("連絡文", "📨", `<pre class="tpl">${esc(m.template)}</pre><button class="btn" data-act="copy" data-text="${esc(m.template)}">コピー</button>`);
  h += card("マニュアルの画像", "🖼️", `<div class="imgs">${m.images.map((src, i) => `<figure><img src="${src}" alt="マニュアルの画像${i + 1}" data-act="img-view" data-src="${i}" data-id="${m.id}"><button class="x" data-act="img-del" data-id="${m.id}" data-i="${i}">×</button></figure>`).join("")}</div>
    <label class="btn filebtn">＋ 画像を追加（職場のマニュアルの写真など）<input type="file" accept="image/*" data-act="img-add" data-id="${m.id}" hidden></label><p class="muted small">1項目に4枚まで。画像は小さくしてから保存します。</p>`);
  h += `<div class="row2"><button class="btn" data-act="modal" data-type="topic" data-id="${m.id}">編集</button><button class="btn danger" data-act="topic-del" data-id="${m.id}">削除</button></div>`;
  return h;
}
function viewGlossary() {
  const q = S.search.trim();
  const list = S.data.terms.filter((t) => !q || (t.word + t.meaning).includes(q));
  return `<input class="search" type="search" placeholder="用語を探す" value="${esc(S.search)}" data-act="search"><button class="btn primary" data-act="modal" data-type="term">＋ 用語を追加</button>` + list.map((t) => card(t.word, "📖", `<p>${esc(t.meaning)}</p>${t.when ? `<p class="small"><b>使う場面：</b>${esc(t.when)}</p>` : ""}${t.action ? `<p class="small"><b>どうする：</b>${esc(t.action)}</p>` : ""}`, `<button class="link" data-act="modal" data-type="term" data-id="${t.id}">編集</button>`)).join("");

  return `<button class="btn primary" data-act="modal" data-type="areanote">＋ 注意ポイントを追加</button>` + (S.data.areaNotes.length ? S.data.areaNotes.slice().reverse().map((n) => card(n.title, "📍", `<p><span class="tag">${esc(n.category)}</span> ${esc(n.text)}</p><p class="muted small">${Fmt.day(n.date)}</p>`, `<button class="link" data-act="modal" data-type="areanote" data-id="${n.id}">編集</button>`)).join("") : card("", "", `<p class="muted">「このマンションは裏口から」「この道は夕方混む」など、エリアの注意点をメモできます。</p>`));
}
function viewTroubleHistory() {

}
function viewMisses() {
  const list = S.data.misses.slice().sort((a, b) => T(b.date) - T(a.date));

  return `<button class="btn primary" data-act="modal" data-type="miss">＋ ミスを記録</button>${rep.length ? card("くり返しているミス（14日）", "🔁", rep.map(([c, n]) => `<p>${esc(c)}：${n}回</p>`).join("")) : ""}` + card(`ミス記録（${list.length}）`, "✍️", list.length ? list.map((m) => `<div class="li"><span class="tag">${esc(m.category)}</span><span class="grow small">${esc(m.memo)}</span><span class="muted small">${Fmt.day(m.date)}</span><button class="x" data-act="miss-del" data-id="${m.id}">×</button></div>`).join("") : `<p class="muted">ミスを記録すると、くり返しているミスを知らせます。責めるためではなく、次に気をつけるための記録です。</p>`);
}

/* ================= 履歴 ================= */
function viewHistoryRoute(r) {
  if (r.page === "session") return viewSession(r.id);
  if (r.page === "analysis") { S.pageTitle = "過去の分析"; return viewHistoryAnalysis(); }
  if (r.page === "growth") { S.pageTitle = "成長の記録"; return viewGrowth(); }
  if (r.page === "level") { S.pageTitle = "新人レベル・バッジ"; return viewLevel(); }
  if (r.page === "weak") { S.pageTitle = "弱点ランキング"; return viewWeak(); }
  if (r.page === "arealog") { S.pageTitle = "エリアごとの記録"; return viewAreaLog(); }
  const list = S.data.sessions.slice().sort((a, b) => T(b.startTime) - T(a.startTime));
  const lv = Growth.level(S.data), badges = Growth.badges(S.data);
  let h = `<button class="row-btn hero" data-act="go" data-tab="history" data-page="analysis"><span class="tile sm" style="background:var(--accent)">📈</span><span class="grow"><b>過去の配達履歴を分析</b><br><span class="muted small">曜日・時間帯・便ごとのペース、荷物の量と時間、速かった日</span></span><span class="chev">›</span></button>`;
  h += `<div class="links">
    <button data-act="go" data-tab="history" data-page="level">${lv.emoji} ${lv.name}・バッジ ${badges.filter((b) => b.earned).length}/${badges.length}</button>
    <button data-act="go" data-tab="history" data-page="growth">📈 成長の記録</button>
    <button data-act="go" data-tab="history" data-page="weak">🎯 弱点ランキング</button>
    <button data-act="go" data-tab="history" data-page="arealog">🗺️ エリアごとの記録</button></div>`;
  const st = A.stats(S.data.sessions.filter((s) => s.finishedAt));
  if (st) h += card("最近10便の平均", "📊", `<div class="minis">${mini("ペース", Fmt.num(st.pkg) + "個/時", "teal")}${mini("所要時間", st.avgHours ? Fmt.dur(st.avgHours * HOUR) : "-")}${mini("便数", S.data.sessions.length + "便")}</div>`);
  h += card(`すべての便（${list.length}）`, "🗓️", list.length ? list.map(sessionRow).join("") : `<p class="muted">まだ記録がありません</p>`);
  return h;
}
function viewSession(id) {
  const s = findSession(id);
  if (!s) return `<p>見つかりません</p>`;
  S.pageTitle = `${Fmt.day(s.startTime)} ${s.trip}便`;
  const f = forecastOf(s), rv = dayReview(s, S.data);
  let h = card("まとめ", "📋", `<div class="minis">${mini("荷物", A.initial(s) + "個")}${mini("開始", Fmt.hm(s.startTime))}${mini("終了", s.finishedAt ? Fmt.hm(s.finishedAt) : "記録中")}${mini("所要時間", A.durationMin(s) ? Fmt.dur(A.durationMin(s) * 60000) : "-")}${mini("ペース", Fmt.num(A.sessionPace(s)) + "個/時", "teal")}${mini("ロスタイム", Math.round(A.lossMinutes(s)) + "分", "or")}</div>${s.memo ? `<p class="small">📝 ${esc(s.memo)}</p>` : ""}`, `<button class="link" data-act="modal" data-type="session" data-id="${s.id}">編集</button>`);
  h += sessionAnalysis(s);
  const bags = s.bags || [];
  if (bags.length) h += card(`バッグ・溢れた荷物（${bags.length}）`, "🎒", bags.slice().sort((a, b) => a.overflow - b.overflow || a.from - b.from).map((b) => bagRow(b, s.id)).join(""));
  if ((s.notes || []).length) h += card("目的地メモ", "📌", s.notes.slice().sort((a, b) => a.stop - b.stop).map((n) => noteRow(n, s, null)).join(""));
  h += card("振り返り", "⭐", `${ratingAvg(s.rating) ? RATING_KEYS.map(([k, t]) => `<div class="li"><span class="grow">${t}</span><span class="stars">${stars(s.rating[k])}</span></div>`).join("") + (s.rating.comment ? `<p class="small">${esc(s.rating.comment)}</p>` : "") : `<p class="muted">まだ振り返りがありません</p>`}
    <p class="b g">できていたこと</p><ul>${rv.good.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>${rv.improve.length ? `<p class="b or">次に気をつけること</p><ul>${rv.improve.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>` : ""}
    <button class="btn" data-act="modal" data-type="review" data-id="${s.id}">振り返りをつける</button>`);
  h += card("記録", "🗒️", snapList(s));
  h += `<button class="btn danger" data-act="session-del" data-id="${s.id}">この便を削除</button>`;
  void f;
  return h;
}
function viewLevel() {
  const lv = Growth.level(S.data), badges = Growth.badges(S.data);
  return card("新人レベル", lv.emoji, `<h2>${lv.emoji} ${lv.name}</h2><div class="lv">${[0, 1, 2, 3].map((i) => `<i class="${i <= lv.level ? "on" : ""}"></i>`).join("")}</div><p class="muted small">🔰新人 → 🌱初級 → 🚚中級 → ⭐独り立ち（安全・正確さを速さより優先して判定）</p><p class="b">${lv.level < 3 ? "次のレベルまで" : ""}</p><ul>${lv.hints.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`)
    + card("内訳（0〜100）", "📊", lv.scores.map(([t, v]) => `<div class="score"><span>${esc(t)}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join(""))
    + card(`バッジ（${badges.filter((b) => b.earned).length}／${badges.length}）`, "🏅", `<div class="badges">${badges.map((b) => `<div class="bdg ${b.earned ? "on" : ""}"><span>${b.emoji}</span><b>${esc(b.title)}</b><small>${esc(b.detail)}</small></div>`).join("")}</div>`);
}
function viewGrowth() {
  const pts = HA.points(S.data.sessions);
  if (!pts.length) return card("", "", `<p class="muted">記録がたまると、ペース・1個あたりの時間・ロスタイムの変化が見られます。</p>`);
  const x0 = T(pts[0].date), xi = (d) => (T(d) - x0) / 86400e3, xm = Math.max(1, xi(pts.at(-1).date));
  const ticks = [0, xm].map((v) => ({ v, label: Fmt.day(new Date(x0 + v * 86400e3)).replace(/\(.\)/, "") }));
  const weekly = {};
  for (const p of pts) { const w = Math.floor(xi(p.date) / 7); (weekly[w] ||= []).push(p); }
  const wk = Object.entries(weekly).map(([w, l]) => ({ label: `${+w + 1}週目`, pace: avg(l.map((p) => p.pace)), sec: 3600 / avg(l.map((p) => p.pace)), loss: avg(l.map((p) => p.loss)) }));
  return card("ペースの変化（個/時）", "📈", Chart.line({ series: [{ name: "ペース", color: "#127686", points: pts.map((p) => ({ x: xi(p.date), y: p.pace, tip: Fmt.day(p.date) })) }], xTicks: ticks, xMin: 0, xMax: xm }))
    + card("週ごとの平均", "🗓️", `<div class="table"><div class="tr th"><span>週</span><span>個/時</span><span>1個あたり</span><span>ロス</span></div>${wk.map((w) => `<div class="tr"><span>${w.label}</span><span>${Fmt.num(w.pace)}</span><span>${Math.round(w.sec)}秒</span><span>${Math.round(w.loss)}分</span></div>`).join("")}</div>`)
    + card("1個あたりの時間（秒）", "⏱️", Chart.bar({ items: wk.map((w) => ({ label: w.label, value: w.sec, color: "#30b0c7" })), values: true }) + `<p class="muted small">低いほど速くなっています。</p>`);
}
function viewWeak() {
  const w = Growth.weaknesses(S.data);
  return card("最近30日でよくあること", "🎯", w.length ? w.map(([k, v], i) => `<div class="score"><span>${i + 1}. ${esc(k)}</span><div class="bar"><i style="width:${Math.min(100, (v / w[0][1]) * 100)}%"></i></div></div>`).join("") + `<p class="muted small">ミス・トラブル・ロスタイムの記録から、多い順に並べています。上の項目の手順を「困った時」で見直すと効果的です。</p>` : `<p class="muted">ミス・トラブル・ロスタイムを記録すると、多い順に表示されます。</p>`);
}
function viewAreaLog() {
  const logs = S.data.areaLogs.slice().sort((a, b) => T(b.date) - T(a.date));
  const by = {};
  for (const l of logs) (by[l.area] ||= []).push(l);
  return `<button class="btn primary" data-act="modal" data-type="arealog">＋ エリアの記録を追加</button>` + (Object.keys(by).length ? Object.entries(by).map(([area, l]) => card(area, "🗺️", `<div class="minis">${mini("回数", l.length + "回")}${mini("平均ペース", Fmt.num(avg(l.map((x) => +x.pace).filter(Boolean))) + "個/時")}${mini("自己評価", Fmt.num(avg(l.map((x) => +x.rating).filter(Boolean))))}</div>${l.slice(0, 5).map((x) => `<div class="li"><span class="muted small">${Fmt.day(x.date)}</span><span class="grow small">${esc(x.memo)}</span><span class="stars">${stars(+x.rating)}</span><button class="x" data-act="arealog-del" data-id="${x.id}">×</button></div>`).join("")}`)).join("") : card("", "", `<p class="muted">担当したエリアごとに、ペースやメモを残せます。</p>`));
}

/* =========================================================
   入力画面（シート）
   ========================================================= */
const sheet = (title, body, opts = {}) => `<div class="sheet-bg" data-act="${opts.noClose ? "" : "close"}"></div><div class="sheet ${opts.full ? "full" : ""}" role="dialog" aria-label="${esc(title)}"><div class="sheet-h"><b>${esc(title)}</b>${opts.noClose ? "" : `<button class="iconbtn" data-act="close" aria-label="閉じる">✕</button>`}</div><div class="sheet-b">${body}</div></div>`;
const opt = (list, v) => list.map((x) => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("");
const timeVal = (d) => (d ? Fmt.inputTime(d) : "");

      <p class="b g">できていたこと</p><ul>${rv.good.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>${rv.improve.length ? `<p class="b or">次に気をつけること</p><ul>${rv.improve.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>` : ""}
      <form data-form="review" data-id="${s.id}">${RATING_KEYS.map(([k, t]) => `<div class="li"><span class="grow">${t}</span><span class="starpick">${[1, 2, 3, 4, 5].map((n) => `<label><input type="radio" name="${k}" value="${n}" ${r[k] === n ? "checked" : ""}><span>★</span></label>`).join("")}</span></div>`).join("")}

  contact() {

    const f = forecastOf(s);
    return sheet("管理者への連絡文", ["遅延", "時間指定", "トラブル", "荷物"].map((k) => { const t = contactTemplate(k, s, f); return `<p class="b">${k}</p><pre class="tpl">${esc(t)}</pre><button class="btn" data-act="copy" data-text="${esc(t)}">コピー</button>`; }).join("<hr>"), { full: true });
  },
  trouble(m) {
    if (m.cat) {
      const kws = TROUBLE_KEYWORDS[m.cat] || [];
      const topics = S.data.manuals.filter((t) => kws.some((k) => [t.title, t.summary, ...t.steps, ...t.table.map((r) => r.code + r.situation)].join(" ").includes(k)));

/* =========================================================
   アシスタント（端末内の記録だけで答える）
   ========================================================= */
function viewAssistant() {
  S.pageTitle = "アシスタント";
  if (!S.chat.length) S.chat.push({ me: false, text: "こんにちは。配達の記録とマニュアルから答えます（外部のAIには送信しません）。\n例：「間に合う？」「なぜ遅い？」「UTAって何？」「オートロックで入れない」" });
  return `<div class="chat">${S.chat.map((c) => `<div class="bubble ${c.me ? "me" : ""}">${esc(c.text).replace(/\n/g, "<br>")}${c.topic ? `<br><button class="link" data-act="go" data-tab="trouble" data-page="topic" data-id="${c.topic}">マニュアルを開く ›</button>` : ""}</div>`).join("")}</div>
    <div class="chips">${["間に合う？", "なぜ遅い？", "今のペースは？", "荷物が余った", "オートロックで入れない"].map((q) => `<button class="chip" data-act="ask" data-v="${q}">${q}</button>`).join("")}</div>
    <form data-form="ask" class="askbar"><input name="q" placeholder="質問を入力" autocomplete="off"><button class="btn primary" type="submit">送信</button></form>`;
}
function answer(q) {
  const has = (arr) => arr.some((k) => q.includes(k));
  const s = activeSession(), f = s ? forecastOf(s) : null;
  const term = S.data.terms.find((t) => q.toUpperCase().includes(t.word.toUpperCase()));
  if (term && has(["何", "意味", "とは", "って"])) return { text: `${term.word}：${term.meaning}${term.when ? "\n使う場面：" + term.when : ""}${term.action ? "\nどうする：" + term.action : ""}` };
  if (has(["間に合", "終わる", "何時"])) {
    if (!f || !f.hasData) return { text: "配達中の便の記録がまだありません。「今日」で残りの荷物の数を記録すると答えられます。" };
    const m = A.margin(s, f);
    let t = `終了予定は ${Fmt.hm(f.eta)} です（${f.method}）。`;
    if (m) t += m.key === "tight" ? `\n目標（${Fmt.hm(s.targetEnd)}）より約${Math.round(m.diff)}分遅れる見込みです。早めに管理者へ相談しましょう。` : m.key === "caution" ? "\n目標ぎりぎりです。" : "\n目標に間に合うペースです。";
    return { text: t };
  }
  if (has(["遅い", "遅れ", "なぜ", "どうして"])) {
    if (!s) return { text: "配達中の便がありません。" };
    const reasons = [], hist = f.historyPace;
    if (hist && f.currentPace && f.currentPace < hist * 0.9) reasons.push(`今のペース（${Fmt.num(f.currentPace)}個/時）が、過去の平均（${Fmt.num(hist)}個/時）より低めです。`);
    const loss = {}; for (const l of s.losses || []) if (l.reason !== "休憩" && l.start) loss[l.reason] = (loss[l.reason] || 0) + (T(l.end || Date.now()) - T(l.start)) / 60000;
    const top = Object.entries(loss).sort((a, b) => b[1] - a[1])[0];
    if (top && top[1] >= 5) reasons.push(`${top[0]}で約${Math.round(top[1])}分止まっています。`);
    const ivs = A.intervals(s).filter((iv) => iv.hours >= 0.25);
    if (ivs.length >= 2 && ivs.at(-1).per() < avg(ivs.map((iv) => iv.per())) * 0.8) reasons.push("直近1時間のペースが落ちています。マンションや会社が続くエリアかもしれません。");
    return { text: reasons.length ? reasons.join("\n") + "\n安全第一で、焦らず進めましょう。" : "記録からは大きな遅れの原因は見つかりませんでした。ロスタイムを記録すると、原因が分かりやすくなります。" };
  }
  if (has(["ペース", "速さ"])) {
    if (!f || !f.hasData) return { text: "記録がまだありません。" };
    return { text: `予測に使っているペースは ${Fmt.num(f.pkgPace)}個/時 です。\n今回の実績：${Fmt.num(f.currentPace)}個/時、過去の平均：${f.historyPace ? Fmt.num(f.historyPace) + "個/時" : "まだなし"}` };
  }
  const words = ["入れない", "オートロック", "不在", "置き配", "余", "足りない", "不足", "誤配", "ロッカー", "宅配ボックス", "満杯", "連絡票", "ステータス", "通行止め", "規制", "イベント", "祭り", "工事", "集荷", "返品", "梱包", "黄色ラベル"];
  const hit = words.filter((w) => q.includes(w));
  if (hit.length) {
    const t = S.data.manuals.map((m) => ({ m, n: hit.filter((w) => [m.title, m.summary, ...m.steps, ...m.points].join(" ").includes(w)).length })).sort((a, b) => b.n - a.n)[0];
    if (t && t.n) return { text: `「${t.m.title}」が参考になります。\n${t.m.summary}\n最初の手順：${t.m.steps[0] || ""}`, topic: t.m.id };
  }
  if (term) return { text: `${term.word}：${term.meaning}` };
  return { text: "うまく答えられませんでした。「間に合う？」「なぜ遅い？」「用語の名前」「困っている状況（例：オートロック）」で聞いてみてください。" };
}

/* =========================================================
   お試しデータ
   ========================================================= */
function demoData() {
  const out = [], now = new Date();
  const rnd = (seed) => { let x = Math.sin(seed) * 10000; return x - Math.floor(x); };
  for (let d = 8; d >= 1; d--) {
    for (const trip of ["C1", "C2"]) {
      if (trip === "C2" && d % 3 === 0) continue;
      const seed = d * 7 + (trip === "C2" ? 3 : 0);
      const day = startOfDay(new Date(now.getTime() - d * 86400e3));
      const start = new Date(day); start.setHours(trip === "C1" ? 8 : 14, trip === "C1" ? 30 : 0);
      const total = trip === "C1" ? 100 + Math.round(rnd(seed) * 30) : 40 + Math.round(rnd(seed) * 15);
      const dest = Math.round(total * 0.68);
      const pace = 16 + rnd(seed + 1) * 5;
      const s = { id: uid(), demo: true, date: iso(day), trip, startTime: iso(start), targetEnd: iso(new Date(start.getTime() + (total / 18) * HOUR)), snapshots: [], bags: [], notes: [], losses: [], memo: "お試しデータ", rating: { sorting: 3 + (seed % 3), time: 3, trouble: 4, pace: 3, safety: 4 + (seed % 2) } };
      let left = total, t = start.getTime(), k = 0;
      while (left > 0) {
        const p = k === 0 ? pace * 0.7 : pace * (0.85 + rnd(seed + k) * 0.3);
        s.snapshots.push({ id: uid(), time: iso(t), packages: left, destinations: Math.round((left / total) * dest) + 1, locations: Math.round((left / total) * dest * 0.8), breakMinutes: 0, appEstimate: k ? iso(t + (left / pace) * HOUR) : null });
        t += HOUR; left = Math.max(0, Math.round(left - p)); k++;
      }
      s.finishedAt = iso(t - HOUR + (s.snapshots.at(-1).packages / pace) * HOUR);
      s.losses.push({ id: uid(), reason: ["渋滞", "荷物探し", "建物で迷った"][seed % 3], start: iso(start.getTime() + 2 * HOUR), end: iso(start.getTime() + 2 * HOUR + (5 + (seed % 10)) * 60000) });
      out.push(s);
    }
  }
  // 今日の配達中の便
  const start = new Date(now.getTime() - 3.2 * HOUR);
  const s = { id: uid(), demo: true, date: iso(startOfDay(now)), trip: "C1", startTime: iso(start), targetEnd: iso(new Date(start.getTime() + 6.5 * HOUR)), snapshots: [], notes: [], losses: [], memo: "お試しデータ", rating: {}, bags: [] };
  [[0, 118, 80, 64], [1, 104, 71, 57], [2, 86, 58, 47], [3, 66, 45, 36]].forEach(([h, p, d, l]) => s.snapshots.push({ id: uid(), time: iso(start.getTime() + h * HOUR), packages: p, destinations: d, locations: l, completed: 80 - d, breakMinutes: 0 }));
  s.bags = [["C12-1A", 1, 12, "黒", "4021"], ["C12-2B", 13, 24, "緑", "9415"], ["C12-3C", 25, 40, "青", "2208"], ["C12-4D", 41, 58, "黄", "7310"], ["C12-5E", 59, 80, "紫", "1187"]].map(([code, from, to, color, number]) => ({ id: uid(), code, from, to, color, number, overflow: false, size: "", done: from < 30 }));
  s.bags.push({ id: uid(), code: "C12-9Z", from: 44, to: 52, color: "", number: "5530", overflow: true, size: "(M) ボックス", done: false });
  const endH1 = Math.min(23, now.getHours() + 1);
  s.notes = [
    { id: uid(), stop: 38, tag: "午前指定", text: "（例）インターホン2回", deadline: iso(atTime(now, `${endH1}:00`)), done: false },
    { id: uid(), stop: 47, tag: "エラーピン", text: "（例）ピンが道路の反対側", done: false },
    { id: uid(), stop: 55, tag: "会社・店舗", text: "（例）受付は2階", done: false }
  ];
  out.push(s);
  return out;
}

/* ---------- 確認画面（ブラウザの確認ダイアログの代わり） ---------- */
function askDialog(text, opts = {}) {
  return new Promise((resolve) => {
    const old = document.getElementById("dlg"); if (old) old.remove();
    const d = document.createElement("div"); d.id = "dlg";
    d.innerHTML = `<div class="sheet-bg" style="z-index:70"></div><div class="dlg" role="alertdialog"><p>${esc(text).replace(/\n/g, "<br>")}</p>${opts.input ? `<input id="dlg-in" type="${opts.type || "text"}" value="${esc(opts.value || "")}">` : ""}<div class="row2"><button class="btn" id="dlg-no">${esc(opts.cancel || "やめる")}</button><button class="btn ${opts.danger ? "danger" : "primary"}" id="dlg-ok">${esc(opts.ok || "OK")}</button></div></div>`;
    document.body.appendChild(d);
    const inp = d.querySelector("#dlg-in"); (inp || d.querySelector("#dlg-ok")).focus();
    const done = (v) => { d.remove(); resolve(v); };
    d.querySelector("#dlg-no").onclick = () => done(opts.input ? null : false);
    d.querySelector("#dlg-ok").onclick = () => done(opts.input ? inp.value : true);
    if (inp) inp.onkeydown = (e) => { if (e.key === "Enter") done(inp.value); };
  });
}
const askConfirm = (text, opts) => askDialog(text, { ok: "はい", ...opts, danger: true });
const askText = (text, value, opts) => askDialog(text, { ...opts, input: true, value });
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function askQ(q) { if (!q || !q.trim()) return; S.chat.push({ me: true, text: q }); S.chat.push({ me: false, ...answer(q) }); render(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30); }

/* ---------- フォーム ---------- */
const num = (v) => (v === "" || v == null ? null : Number(v));
const lines = (v) => String(v || "").split("\n").map((x) => x.trim()).filter(Boolean);
const FORM = {
  auth: submitAuth,
  ask(fd, form) { askQ(fd.get("q")); },
  start(fd) {
    const day = new Date(fd.get("date") + "T00:00:00");
    const start = atTime(day, fd.get("start"));
    let target = atTime(day, fd.get("target")); if (target && T(target) <= T(start)) target.setDate(target.getDate() + 1);
    const s = { id: uid(), date: iso(day), trip: S.trip, startTime: iso(start), targetEnd: target ? iso(target) : null, snapshots: [], bags: [], notes: [], losses: [], rating: {}, memo: "", finishedAt: null };
    if (fd.get("pkg") !== "") s.snapshots.push({ id: uid(), time: iso(start), packages: +fd.get("pkg"), destinations: num(fd.get("dest")) ?? Math.round(+fd.get("pkg") * 0.7), locations: num(fd.get("loc")) ?? 0, breakMinutes: 0 });
    if (S._pendingOcr) { const p = S._pendingOcr; S._pendingOcr = null; if (!s.snapshots.length && p.packages != null) s.snapshots.push({ id: uid(), time: iso(p.time || start), packages: p.packages, destinations: p.destinations ?? p.undelivered ?? 0, locations: p.locations ?? 0, completed: p.completed ?? null, breakMinutes: 0 }); if (p.bags && p.bags.length) s.bags = p.bags; }
    mutate((d) => d.sessions.push(s));
    toast(`${S.trip}便を開始しました`);
  },
  snap(fd, form) {
    const s = findSession(form.dataset.sid), id = form.dataset.id;
    const base = A.sorted(s).at(-1) ? new Date(A.sorted(s).at(-1).time) : new Date(s.startTime);
    let time = atTime(id ? s.snapshots.find((x) => x.id === id).time : new Date(), fd.get("time"));
    if (!id && T(time) < T(s.startTime) - 6 * HOUR) time.setDate(time.getDate() + 1);
    void base;
    const v = { time: iso(time), packages: +fd.get("packages"), destinations: num(fd.get("destinations")) ?? 0, locations: num(fd.get("locations")) ?? 0, completed: num(fd.get("completed")), breakMinutes: num(fd.get("breakMinutes")) || 0, myEstimate: fd.get("myEstimate") ? iso(atTime(time, fd.get("myEstimate"))) : null, memo: fd.get("memo") || "" };
    S.modal = null;
    mutate(() => {
      if (id) Object.assign(s.snapshots.find((x) => x.id === id), v);
      else {
        const tmp = { ...s, snapshots: [...s.snapshots, { id: "tmp", ...v }] };
        const f = A.forecast(tmp, S.data.sessions, S.data.settings);
        s.snapshots.push({ id: uid(), ...v, appEstimate: f.eta && !f.isDone ? iso(f.eta) : null });
        if (v.packages <= 0 && !s.finishedAt) s.finishedAt = v.time;
      }
    });
    toast("記録しました");
    const s2 = findSession(s.id); if (s2.finishedAt && !id) { S.modal = { type: "review", id: s2.id }; render(); }
  },
  bag(fd, form) {
    const s = findSession(form.dataset.sid), id = form.dataset.id;
    const v = { code: fd.get("code").trim().toUpperCase(), overflow: fd.get("overflow") === "1", from: num(fd.get("from")) || 0, to: num(fd.get("to")) || num(fd.get("from")) || 0, color: fd.get("color"), number: fd.get("number"), size: fd.get("size") };
    S.modal = null; mutate(() => { if (id) Object.assign(s.bags.find((x) => x.id === id), v); else s.bags.push({ id: uid(), done: false, ...v }); });
  },
  note(fd, form) {
    const s = findSession(form.dataset.sid), id = form.dataset.id;
    const dl = fd.get("deadline") ? atTime(s.startTime, fd.get("deadline")) : fd.get("tag") === "午前指定" ? atTime(s.startTime, "12:00") : null;
    const v = { stop: +fd.get("stop"), tag: fd.get("tag"), text: fd.get("text"), deadline: dl ? iso(dl) : null, placeId: fd.get("placeId") || null };
    S.modal = null; mutate(() => { if (id) Object.assign(s.notes.find((x) => x.id === id), v); else s.notes.push({ id: uid(), done: false, ...v }); });
  },
  place(fd, form) {
    const id = form.dataset.id;
    const v = { name: fd.get("name").trim(), kind: fd.get("kind"), address: fd.get("address"), open: fd.get("open"), close: fd.get("close"), closedDays: fd.getAll("cd").map(Number), breakText: fd.get("breakText"), note: fd.get("note") };
    S.modal = null; mutate((d) => { if (id) Object.assign(d.places.find((x) => x.id === id), v); else d.places.push({ id: uid(), ...v }); });
  },
  topic(fd, form) {
    const id = form.dataset.id;
    const v = { title: fd.get("title").trim(), icon: fd.get("icon").trim() || "📘", summary: fd.get("summary").trim(), steps: lines(fd.get("steps")), cautions: lines(fd.get("cautions")), points: lines(fd.get("points")), template: fd.get("template").trim(),
      table: lines(fd.get("table")).map((l) => l.split(/[｜|]/).map((x) => x.trim())).filter((a) => a.length >= 2).map(([place, situation, code]) => ({ place, situation, code: code || "" })) };
    let newId = id;
    S.modal = null; mutate((d) => { if (id) Object.assign(d.manuals.find((x) => x.id === id), v); else { newId = uid(); d.manuals.push({ id: newId, images: [], ...v }); } });
    go("trouble", "topic", newId);
  },
  term(fd, form) { const id = form.dataset.id; const v = { word: fd.get("word").trim(), meaning: fd.get("meaning").trim(), when: fd.get("when").trim(), action: fd.get("action").trim() }; S.modal = null; mutate((d) => { if (id) Object.assign(d.terms.find((x) => x.id === id), v); else d.terms.push({ id: uid(), ...v }); }); },
  areanote(fd, form) { const id = form.dataset.id; const v = { title: fd.get("title").trim(), category: fd.get("category"), text: fd.get("text") }; S.modal = null; mutate((d) => { if (id) Object.assign(d.areaNotes.find((x) => x.id === id), v); else d.areaNotes.push({ id: uid(), date: iso(new Date()), ...v }); }); },
  arealog(fd) { S.modal = null; mutate((d) => d.areaLogs.push({ id: uid(), area: fd.get("area").trim(), date: iso(new Date(fd.get("date") + "T12:00:00")), pace: num(fd.get("pace")), rating: num(fd.get("rating")), memo: fd.get("memo") })); },
  miss(fd) { const s = activeSession(); S.modal = null; mutate((d) => d.misses.push({ id: uid(), date: iso(new Date()), category: fd.get("category"), memo: fd.get("memo"), sessionId: s ? s.id : null })); toast("記録しました。次に気をつけましょう"); },
  review(fd, form) {
    const s = findSession(form.dataset.id), r = { comment: fd.get("comment") || "" };
    for (const [k] of RATING_KEYS) r[k] = num(fd.get(k)) || 0;
    S.modal = null; mutate(() => { s.rating = r; }); toast("振り返りを保存しました");
  },
  session(fd, form) {
    const s = findSession(form.dataset.id), day = new Date(fd.get("date") + "T00:00:00");
    const st = atTime(day, fd.get("start")), tg = atTime(day, fd.get("target")), fi = atTime(day, fd.get("finish"));
    if (tg && T(tg) < T(st)) tg.setDate(tg.getDate() + 1); if (fi && T(fi) < T(st)) fi.setDate(fi.getDate() + 1);
    S.modal = null; mutate(() => { Object.assign(s, { trip: fd.get("trip"), date: iso(day), startTime: iso(st), targetEnd: tg ? iso(tg) : null, finishedAt: fi ? iso(fi) : null, memo: fd.get("memo") }); });
  },
  settings(fd) {
    mutate((d) => Object.assign(d.settings, { defaultPkgPace: clamp(num(fd.get("defaultPkgPace")) || 20, 5, 60), priorHours: clamp(num(fd.get("priorHours")) || 1.5, 0.5, 5), recentWeight: clamp(num(fd.get("recentWeight")) ?? 0.5, 0, 1), countReturnPin: !!fd.get("countReturnPin"), reminderOn: !!fd.get("reminderOn"), reminderMinutes: clamp(num(fd.get("reminderMinutes")) || 60, 15, 180) }));
    if (fd.get("reminderOn") && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
    toast("設定を保存しました");
  },
  async password(fd) {
    const a = fd.get("pw"), b = fd.get("pw2");
    if (a !== b) { toast("確認用のパスワードが一致しません"); return; }
    try { await Cloud.changePassword(a); S.modal = null; render(); toast("パスワードを変更しました"); } catch (e) { toast(authErrorText(e)); }
  }
};

/* ---------- 画像・スクショ ---------- */
async function shrinkImage(file, max = 900, q = 0.6) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { URL.revokeObjectURL(url); }
}
async function readShots(files) {
  const results = [];
  for (const [i, f] of [...files].entries()) {
    const ls = await OCR.read(f, (t) => { S.modal = { type: "ocr", text: `${i + 1}/${files.length}枚目：${t}` }; render(); });
    results.push(OCR.parse(ls, new Date()));
  }
  const r = { bags: [] };
  for (const p of results) {
    if (p.time && (!r.time || T(p.time) > T(r.time))) r.time = p.time;
    for (const k of ["destinations", "locations", "packages", "completed", "undelivered"]) if (r[k] == null && p[k] != null) r[k] = p[k];
    for (const b of p.bags) if (!r.bags.some((x) => OCR.bagKey(x) === OCR.bagKey(b))) r.bags.push(b);
  }
  if (r.destinations == null && r.undelivered != null) r.destinations = r.undelivered;
  const parts = [];
  if (r.packages != null) parts.push("荷物" + r.packages); if (r.destinations != null) parts.push("目的地" + r.destinations); if (r.locations != null) parts.push("ロケーション" + r.locations); if (r.bags.length) parts.push("バッグ" + r.bags.length + "件");
  r.summary = parts.length ? "読み取り結果：" + parts.join("・") + "（違っていたら直してください）" : "数字を読み取れませんでした。手入力してください。";
  return r;
}
const CHANGE = {
  async "ocr-snap"(el) {
    const files = el.files; if (!files.length) return;
    const s = activeSession();
    try { S.modal = { type: "ocr" }; render(); const r = await readShots(files); if (r.bags.length) mutate(() => { for (const b of r.bags) if (!s.bags.some((x) => OCR.bagKey(x) === OCR.bagKey(b))) s.bags.push(b); }); S.modal = { type: "snap", sid: s.id, prefill: r }; render(); }
    catch (e) { S.modal = { type: "snap", sid: s.id, prefill: { summary: "読み取りに失敗しました（" + e.message + "）。手入力してください。" } }; render(); }
  },
  async "ocr-start"(el) {
    const files = el.files; if (!files.length) return;
    try { S.modal = { type: "ocr" }; render(); const r = await readShots(files); S._pendingOcr = r; S.modal = null; render(); const form = $('form[data-form="start"]'); if (form) { if (r.packages != null) form.pkg.value = r.packages; if (r.destinations != null) form.dest.value = r.destinations; if (r.locations != null) form.loc.value = r.locations; if (r.time) form.start.value = Fmt.inputTime(r.time); } toast(r.summary); }
    catch (e) { S.modal = null; render(); toast("読み取りに失敗しました。手入力してください。"); }
  },
  async "ocr-bags"(el) {
    const files = el.files; if (!files.length) return; const sid = el.dataset.sid;
    try { S.modal = { type: "ocr" }; render(); const r = await readShots(files); S.modal = r.bags.length ? { type: "bagimport", sid, bags: r.bags } : null; render(); if (!r.bags.length) toast("バッグを読み取れませんでした。手入力してください。"); }
    catch (e) { S.modal = null; render(); toast("読み取りに失敗しました"); }
  },
  async "img-add"(el) {
    const f = el.files[0]; if (!f) return; const m = S.data.manuals.find((x) => x.id === el.dataset.id);
    if (m.images.length >= 4) { toast("画像は1項目に4枚までです"); return; }
    try { const src = await shrinkImage(f); mutate(() => m.images.push(src)); toast("画像を追加しました"); } catch { toast("画像を読み込めませんでした"); }
  },
  async restore(el) {
    const f = el.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d.sessions) throw new Error(); if (!await askConfirm("今のデータを、このバックアップで置き換えますか？")) return; S.data = migrate(d); S.modal = null; markDirty(); render(); toast("バックアップから戻しました"); }
    catch { toast("バックアップのファイルを読み込めませんでした"); }
  }
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || !el.dataset.act || el.tagName === "INPUT") return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === "A") ev.preventDefault(); fn(el, ev); }
});
document.addEventListener("change", (ev) => { const el = ev.target; if (el.dataset && CHANGE[el.dataset.act]) CHANGE[el.dataset.act](el).finally(() => { el.value = ""; }); });
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.act === "search") { S.search = el.value; const pos = el.selectionStart; render(); const n = $('[data-act="search"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener("submit", (ev) => {
  const form = ev.target.closest("form[data-form]"); if (!form) return;
  ev.preventDefault();
  const fn = FORM[form.dataset.form];
  if (fn) fn(new FormData(form), form);
  if (form.dataset.form === "ask") form.reset();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.modal && !["ocr", "onboarding"].includes(S.modal.type)) { S.modal = null; render(); } });

boot();
setInterval(() => { if (S.mode === "app" && !S.modal && S.route.tab === "today" && !document.activeElement.matches("input,textarea,select")) render(); }, 60000);
